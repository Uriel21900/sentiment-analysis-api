name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx uvicorn

    - name: Run tests
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        PYTHONPATH: .
      run: |
          pytest tests/test_simple.py -v --tb=short

    - name: Run API validation
      run: |
        echo "Running API validation..."
        python -c "import fastapi; import uvicorn; print('FastAPI and uvicorn verified')"

    - name: Lint check
      run: |
        pip install flake8
        echo "Running flake8..."
        flake8 api/ tests/ --max-line-length=79 --count --ignore=W503,E203 --statistics

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy notification
      run: |
        echo "Deployment notification sent!"
        echo "Please configure your deployment script in .github/workflows/deploy.yml"
